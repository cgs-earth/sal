name: Push SAL Module Ontology to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.build.outputs.url }}

    steps:
      - uses: cgs-earth/onto-to-pages@main
        id: build
        with:
            output_dir: ./build/testdata/reference/public