# Records the terminal demos embedded in the command reference. The GIFs are not
# committed: this workflow regenerates them from the working tree so they can never
# drift from the CLI's real output, and publishes them as the `demo-gifs` artifact.
# The Pages deploy downloads that artifact into docs/public/demos before building
# the site.

name: SAL Demo GIFs

on:
  workflow_dispatch:
  # Called by push_pages.yml so a deploy of main records the GIFs inside the same
  # run and can hand them to the site build as an artifact. Pushes to main are
  # therefore excluded here, otherwise every one of them would record twice.
  workflow_call:
  push:
    branches-ignore: [main]

concurrency:
  group:
    ${{ github.workflow }}-${{ github.ref_name }}-${{github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  record:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.25

      # ttyd is the terminal VHS drives and ffmpeg is what encodes the frames, so
      # both have to be present before vhs will record anything. fonts-jetbrains-mono
      # is VHS's default font; without it the recordings fall back to whatever the
      # runner happens to have and the GIFs change size between runs.
      - name: Install VHS and its dependencies
        run: |
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://repo.charm.sh/apt/gpg.key | sudo gpg --dearmor -o /etc/apt/keyrings/charm.gpg
          echo "deb [signed-by=/etc/apt/keyrings/charm.gpg] https://repo.charm.sh/apt/ * *" | sudo tee /etc/apt/sources.list.d/charm.list
          sudo apt-get update
          sudo apt-get install -y vhs ffmpeg ttyd fonts-jetbrains-mono
          vhs --version
          ttyd --version

      # `sal query` shells out to duckdb, so the query demo needs the CLI on PATH.
      - name: Install DuckDB
        run: |
          curl -fsSL -o /tmp/duckdb.zip \
            https://github.com/duckdb/duckdb/releases/download/v1.5.5/duckdb_cli-linux-amd64.zip
          sudo unzip -o /tmp/duckdb.zip -d /usr/local/bin
          duckdb --version

      - name: Record the demos
        run: ./docs/demos/generate.sh

      - name: Upload the demo GIFs
        uses: actions/upload-artifact@v4
        with:
          name: demo-gifs
          path: docs/public/demos
          if-no-files-found: error
