name: SAL Go Tests

on:
  workflow_dispatch: # Allows manual triggering of the workflow
  push:

concurrency:
  group:
    ${{ github.workflow }}-${{ github.ref_name }}-${{github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout GitHub Action"
        uses: actions/checkout@v4
        id: checkout
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.26
      # The tests that serve the web UI skip themselves when serve/sal-ui/dist
      # is not built, since it is not committed; building it here is what keeps
      # them running in CI.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: serve/sal-ui/package-lock.json
      - name: Build the web UI
        run: cd serve/sal-ui && npm ci && npm run build
      - name: Go tests
        shell: bash 
        run: |
          go test -v ./...