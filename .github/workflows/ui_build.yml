name: SAL UI Build

on:
  workflow_dispatch: # Allows manual triggering of the workflow
  push:

concurrency:
  group:
    ${{ github.workflow }}-${{ github.ref_name }}-${{github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: serve/sal-ui

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: serve/sal-ui/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      # The build output is not committed; release.yml builds it again for the
      # binaries it publishes, so this only checks that the sources compile.
      - name: Build
        run: npm run build
