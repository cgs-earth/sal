name: Deploy to GitHub Pages

on:
  # Trigger the workflow every time you push to the `main` branch
  # Using a different branch name? Replace `main` with your branch’s name
  push:
    branches: [ main ]
  # Allows you to run this workflow manually from the Actions tab on GitHub.
  workflow_dispatch:

# Allow this job to clone the repo and create a page deployment
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v7

      # This has to run before the astro build: the action does its own
      # actions/checkout, which git-cleans the workspace and would delete
      # docs/dist. ./sal-gha is outside docs/, so `astro build` leaves it alone.
      - name: Build the ontology docs
        uses: cgs-earth/onto-to-pages@main
        with:
          input_dir: ./build/testdata/reference/public
          output_dir: ./sal-gha
          deploy: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Build the docs site
        working-directory: docs
        run: |
          npm ci
          npm run build

      # pylode writes its own index.html, so it gets its own subdirectory
      # rather than overwriting astro's. Served at <pages url>/ontology/.
      - name: Merge the ontology docs into the site
        run: |
          mkdir -p docs/dist/ontology
          cp -R ./sal-gha/. docs/dist/ontology/

      - name: Upload the combined site
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
