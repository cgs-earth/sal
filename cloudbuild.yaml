steps:
  - name: gcr.io/cloud-builders/docker
    env:
    - DOCKER_BUILDKIT=1
    args:
      - "-c"
      # Pull the cache image if available. The first build of a service has no
      # cache tag to pull, so only pass --cache-from when the pull succeeded.
      # BUILDKIT_INLINE_CACHE writes the cache metadata into the image being
      # built; without it BuildKit finds nothing to reuse in the pulled tag.
      # $$ escapes the shell variable so Cloud Build leaves it for bash
      - |
        set -e
        IMAGE="$_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME"
        CACHE_FROM=""
        if docker pull "$$IMAGE:cache"; then
          CACHE_FROM="--cache-from=$$IMAGE:cache"
        else
          echo "No cache image at $$IMAGE:cache; building without cache."
        fi
        docker build \
          $$CACHE_FROM \
          --progress=plain \
          --build-arg BUILDKIT_INLINE_CACHE=1 \
          --build-arg DEMO=true \
          --tag "$$IMAGE:$COMMIT_SHA" \
          --tag "$$IMAGE:cache" \
          -f Dockerfile \
          .
    id: Build
    entrypoint: bash
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - >-
        $_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA
    id: Push
  - name: gcr.io/cloud-builders/docker
    # The cache tag is written by the build step above; this only publishes it so
    # the next build can pull it
    args:
      - push
      - >-
        $_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:cache
    id: Push Cache
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    # `run deploy` rather than `run services update` so the first build of a new
    # service creates it instead of failing on a service that isn't there yet
    args:
      - run
      - deploy
      - $_SERVICE_NAME
      - "--platform=managed"
      - >-
        --image=$_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA
      - >-
        --labels=managed-by=gcp-cloud-build-deploy-cloud-run,commit-sha=$COMMIT_SHA,gcb-build-id=$BUILD_ID,gcb-trigger-id=$_TRIGGER_ID
      - "--region=$_DEPLOY_REGION"
      - "--quiet"
    id: Deploy
    entrypoint: gcloud
images:
  - >-
    $_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA
options:
  substitutionOption: MUST_MATCH
  logging: CLOUD_LOGGING_ONLY
timeout: 1800s
tags:
  - gcp-cloud-build-deploy-cloud-run
  - gcp-cloud-build-deploy-cloud-run-managed
  - wwdh
